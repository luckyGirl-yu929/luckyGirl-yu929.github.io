<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BYME · Be Yourself ｜ YU 的个人作品集</title>
  <meta name="description" content="YU —— 前车载硬件工程师，转型中的 AI 产品经理。BYME · Be Yourself 单页作品集：认识我 / 工作经历 / 项目经历 / 技能特长。" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <link rel="preload" as="image" href="assets/cover.jpg" fetchpriority="high" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <noscript><style>
    .page__badge, .hint, .skills, .outro { opacity: 1 !important; transform: none !important; }
    .screen--intro .hotspots { pointer-events: auto; }
  </style></noscript>
</head>
<body>

  <!-- ===== 顶部滚动进度条 ===== -->
  <div class="progress" aria-hidden="true"><span class="progress__bar" id="progressBar"></span></div>

  <!-- ===== 右侧区块导航（桌面 / 平板） ===== -->
  <nav class="rail" id="rail" aria-label="区块导航">
    <button class="rail__dot" type="button" data-target="screen-01">
      <span class="rail__label">认识我</span>
      <b class="rail__num">01</b>
      <i class="rail__line"></i>
    </button>
    <button class="rail__dot" type="button" data-target="screen-02">
      <span class="rail__label">工作经历</span>
      <b class="rail__num">02</b>
      <i class="rail__line"></i>
    </button>
    <button class="rail__dot" type="button" data-target="screen-03">
      <span class="rail__label">项目经历</span>
      <b class="rail__num">03</b>
      <i class="rail__line"></i>
    </button>
    <button class="rail__dot" type="button" data-target="screen-04">
      <span class="rail__label">技能特长</span>
      <b class="rail__num">04</b>
      <i class="rail__line"></i>
    </button>
  </nav>

  <!-- ============================================================
       通用结构说明（5 屏一致）
       .page           = 铺满整屏的底衬（模糊放大的同图，让留边不突兀）
       .page__frame    = 按素材原始比例锁死的「整页」，宽高自动取最大且不被裁切
       .page__media    = 页面本体（视频 / 图片），100% 完整显示
       .page__badge    = 左下角铭牌：四页共用同一套尺寸与坐标（见 style.css 的 --badge-*）
       ============================================================ -->

  <!-- ============ 屏 1 · 首屏：intro.mp4 → cover.png ============ -->
  <section class="screen screen--intro" id="screen-intro" data-index="0">
    <div class="page" style="--page-ratio: 1920/1088">
      <img class="page__fill" src="assets/cover.jpg" alt="" aria-hidden="true" />

      <div class="page__frame">
        <!-- 静态封面：垫在视频下面，视频播完淡出后露出它 -->
        <img class="page__media page__cover" id="coverImg"
             src="assets/cover.png"
             alt="BYME 静态封面：JUST BE YOURSELF，IP 形象与 01-04 四个章节入口" />

        <!-- 开场动画：播放一次，不循环，静音 -->
        <video class="page__media page__video" id="introVideo"
               src="assets/intro.mp4"
               autoplay muted playsinline preload="auto"
               disablepictureinpicture></video>

        <!-- 原图里的 4 个按钮：透明热区，百分比相对封面原图 1920×1088
             按 2×2 排布：01 左上 / 02 右上 / 03 左下 / 04 右下
             若位置有偏差：在页面上按 D 键可显示热区边框进行校准 -->
        <div class="hotspots" id="hotspots">
          <a class="hotspot" href="#screen-01" data-key="01"
             style="left:6.5%;top:51%;width:20.5%;height:15%" aria-label="01 认识我"></a>
          <a class="hotspot" href="#screen-02" data-key="02"
             style="left:69.5%;top:51.5%;width:22%;height:15%" aria-label="02 工作经历"></a>
          <a class="hotspot" href="#screen-03" data-key="03"
             style="left:13.5%;top:70.5%;width:20%;height:13.5%" aria-label="03 项目经历"></a>
          <a class="hotspot" href="#screen-04" data-key="04"
             style="left:69%;top:71%;width:23%;height:14%" aria-label="04 技能特长"></a>
        </div>
      </div>
    </div>

    <button class="intro-skip" id="introSkip" type="button">跳过开场 ▸</button>

    <!-- 窄屏 / 竖屏：图上热区太小，改用真实按钮 -->
    <ul class="cover-nav" id="coverNav">
      <li><a href="#screen-01"><b>01</b> 认识我 <span>ABOUT ME</span></a></li>
      <li><a href="#screen-02"><b>02</b> 工作经历 <span>EXPERIENCE</span></a></li>
      <li><a href="#screen-03"><b>03</b> 项目经历 <span>PROJECTS</span></a></li>
      <li><a href="#screen-04"><b>04</b> 技能特长 <span>SKILLS</span></a></li>
    </ul>

    <div class="hint">SCROLL<i class="hint__arrow">▾</i></div>
  </section>

  <!-- ============ 屏 2 · 01 认识我 ============ -->
  <section class="screen vsection" id="screen-01" data-index="1">
    <div class="page" style="--page-ratio: 1344/768">
      <img class="page__fill" src="assets/01-about.jpg" alt="" aria-hidden="true" />
      <div class="page__frame">
        <video class="page__media" src="assets/01-about.mp4"
               poster="assets/01-about.jpg"
               loop muted playsinline preload="metadata" disablepictureinpicture></video>
        <!--
          统一的 DOM 铭牌已按你的要求移除，改用素材里原本自带的那枚贴纸。
          想恢复「四页同尺寸/同位置/同颜色」的统一铭牌，把下面这段放回本位置即可
          （01/02/03/04 分别改成对应编号与标题，样式见 style.css 的 --badge-*）：
          <div class="page__badge">
            <b class="page__num">01</b>
            <span class="page__txt"><span class="page__cn">认识我</span><span class="page__en">ABOUT ME</span></span>
          </div>
        -->
      </div>
    </div>
    <div class="hint">SCROLL<i class="hint__arrow">▾</i></div>
  </section>

  <!-- ============ 屏 3 · 02 工作经历 ============ -->
  <section class="screen vsection" id="screen-02" data-index="2">
    <div class="page" style="--page-ratio: 1344/768">
      <img class="page__fill" src="assets/02-experience.jpg" alt="" aria-hidden="true" />
      <div class="page__frame">
        <video class="page__media" src="assets/02-experience.mp4"
               poster="assets/02-experience.jpg"
               loop muted playsinline preload="metadata" disablepictureinpicture></video>
      </div>
    </div>
    <div class="hint">SCROLL<i class="hint__arrow">▾</i></div>
  </section>

  <!-- ============ 屏 4 · 03 项目经历 ============ -->
  <section class="screen vsection" id="screen-03" data-index="3">
    <div class="page" style="--page-ratio: 1344/768">
      <img class="page__fill" src="assets/03-projects.jpg" alt="" aria-hidden="true" />
      <div class="page__frame">
        <video class="page__media" src="assets/03-projects.mp4"
               poster="assets/03-projects.jpg"
               loop muted playsinline preload="metadata" disablepictureinpicture></video>
      </div>
    </div>
    <div class="hint">SCROLL<i class="hint__arrow">▾</i></div>
  </section>

  <!-- ============ 屏 5 · 04 技能特长（整页浅色章节图 + 右侧三张错落场景卡） ============ -->
  <section class="screen vsection screen--skills is-light-screen" id="screen-04" data-index="4">
    <div class="page page--light" style="--page-ratio: 1920/1072">
      <img class="page__fill" src="assets/section-04-skills.png" alt="" aria-hidden="true" />
      <div class="page__frame">
        <img class="page__media" src="assets/section-04-skills.png" alt="" aria-hidden="true" />
      </div>
    </div>

    <!--
      ⬇ 左栏留白（约 45%）—— 待写文字直接放这里。
      已备好样式类 .skills__text：垂直居中、max-width 36vw、深紫字。
      示例：
      <div class="skills__text">
        <h3>会的东西</h3>
        <ul><li>需求分析</li><li>PRD</li></ul>
      </div>
    -->

    <!-- 右侧：三张场景卡（4:3 横版，右缘锁在视口 90% 以内）卡下只放中文 + 英文两行 -->
    <div class="skills">
      <figure class="skill">
        <video class="skill__video" src="assets/skills-01-skate-scene.mp4"
               poster="assets/skills-01-skate-scene.jpg"
               loop muted playsinline preload="none" disablepictureinpicture
               aria-label="滑板：傍晚的城市路边"></video>
        <figcaption class="skill__cap">
          <b class="skill__cn">路边滑板</b>
          <span class="skill__en">SKATEBOARDING</span>
        </figcaption>
      </figure>
      <figure class="skill">
        <video class="skill__video" src="assets/skills-02-dance-scene.mp4"
               poster="assets/skills-02-dance-scene.jpg"
               loop muted playsinline preload="none" disablepictureinpicture
               aria-label="街舞：涂鸦墙前"></video>
        <figcaption class="skill__cap">
          <b class="skill__cn">街头街舞</b>
          <span class="skill__en">STREET DANCE</span>
        </figcaption>
      </figure>
      <figure class="skill">
        <video class="skill__video" src="assets/skills-03-draw-scene.mp4"
               poster="assets/skills-03-draw-scene.jpg"
               loop muted playsinline preload="none" disablepictureinpicture
               aria-label="插画：户外草地"></video>
        <figcaption class="skill__cap">
          <b class="skill__cn">户外写生</b>
          <span class="skill__en">SKETCHING</span>
        </figcaption>
      </figure>
    </div>

    <div class="outro">
      <a class="btn" href="https://github.com/luckyGirl-yu929" target="_blank" rel="noopener">GitHub ↗</a>
      <a class="btn btn--ghost" href="mailto:2474110961@qq.com">✉ 2474110961@qq.com</a>
      <p class="outro__note">BYME © 2026 · Be Yourself.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
