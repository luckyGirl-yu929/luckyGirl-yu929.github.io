<title>跨境电商选品中心</title>
<style>
  :root{
    --primary:#2f54eb; --primary-soft:#e8edff; --primary-deep:#1d39c4;
    --bg:#f4f6fb; --card:#ffffff; --line:#e6e9f0; --text:#1f2533; --muted:#8a93a6;
    --red:#e23b3b; --green:#16a34a; --orange:#f57c00; --radius:14px;
    --shadow:0 4px 18px rgba(31,37,51,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:16px;}
  .app{min-height:100vh; display:flex; flex-direction:column;}
  /* top bar */
  .topbar{background:var(--card); border-bottom:1px solid var(--line); padding:0 22px; height:60px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:30;}
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px;}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .spacer{flex:1;}
  .reset-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 12px;font-size:13px;}
  .reset-btn:hover{color:var(--primary);border-color:var(--primary);}
  /* nav tabs */
  .nav{display:flex; gap:6px; background:var(--card); border-bottom:1px solid var(--line); padding:0 22px;}
  .nav .tab{padding:13px 18px; font-size:15px; color:var(--muted); border-bottom:3px solid transparent; background:none; border-top:none;border-left:none;border-right:none; font-weight:600;}
  .nav .tab.active{color:var(--primary); border-bottom-color:var(--primary);}
  .content{flex:1; padding:22px; max-width:1240px; width:100%; margin:0 auto;}
  /* cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .stat{padding:16px 18px;}
  .stat .k{color:var(--muted); font-size:13px;}
  .stat .v{font-size:26px; font-weight:700; margin-top:4px;}
  /* toolbar */
  .toolbar{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar .title{font-size:18px; font-weight:700; margin-right:auto;}
  .btn{background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:7px;}
  .btn:hover{background:var(--primary-deep);}
  .btn.ghost{background:#fff; color:var(--primary); border:1px solid var(--primary);}
  .btn.ghost:hover{background:var(--primary-soft);}
  .btn.sm{padding:7px 12px; font-size:13px;}
  .btn.light{background:var(--primary-soft); color:var(--primary);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  /* table */
  table{width:100%; border-collapse:collapse;}
  th,td{text-align:left; padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.5px;}
  th{color:var(--muted); font-weight:600; background:#fafbfe;}
  tbody tr:hover{background:#fafbff;}
  .tag{display:inline-block; background:var(--primary-soft); color:var(--primary); border-radius:6px; padding:2px 9px; font-size:12px; margin:2px 4px 2px 0;}
  .tag.gray{background:#f0f2f7; color:var(--muted);}
  .muted{color:var(--muted);}
  .pill{font-size:12px; padding:3px 10px; border-radius:20px; background:#eef1f7; color:var(--muted);}
  /* MCP 商品池（Skill 调用 MCP 生成的结果） */
  .badge-mcp{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:3px 7px;border-radius:5px;
    background:#e6f4ff;color:#0958d9;border:1px solid #91caff;margin-left:6px;vertical-align:middle;}
  .mcp-status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
  .mcp-status .dot{width:8px;height:8px;border-radius:50%;background:#c9cfdb;display:inline-block;}
  .mcp-status.on .dot{background:var(--green);}
  .mcp-status.off .dot{background:var(--red);}
  .src-tag{font-size:11.5px;color:var(--primary);background:var(--primary-soft);border-radius:5px;padding:1px 6px;}
  .rule-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
  .rule-row:last-child{border-bottom:none;}
  .rule-nm{font-weight:600;min-width:120px;}
  .rule-op{color:var(--text);}
  .lock{font-size:11px;color:var(--red);border:1px solid #ffccc7;background:#fff2f0;border-radius:5px;padding:1px 6px;}
  .fbar{height:8px;border-radius:5px;background:#eef1f7;overflow:hidden;min-width:90px;flex:1;}
  .fbar i{display:block;height:100%;background:var(--primary);border-radius:5px;}
  .fbar i.warn{background:var(--orange);}
  .cf-item{border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:#fffdf7;}
  .cf-item .t{font-weight:700;font-size:13.5px;}
  .cf-item .f{font-size:13px;margin-top:4px;}
  .cf-item .a{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:12px;}
  @media(max-width:768px){
    .rule-nm{min-width:auto;}
    .fbar{min-width:60px;}
  }
  /* create page */
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; padding:20px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px; font-weight:600; color:#46506a;}
  .field input,.field textarea,.field select{border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#fff; color:var(--text); width:100%;}
  .field textarea{resize:vertical; min-height:64px;}
  .section-title{font-size:16px; font-weight:700; padding:18px 20px 6px; display:flex; align-items:center; gap:8px;}
  .section-title .num{background:var(--primary); color:#fff; width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
  .group{margin:14px 20px; border:1px dashed var(--line); border-radius:12px; padding:14px; background:#fcfdff;}
  .group-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .group-badge{font-size:12px; font-weight:700; color:var(--primary); background:var(--primary-soft); padding:3px 10px; border-radius:20px;}
  .cond{border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; background:#fff; display:flex; align-items:flex-start; gap:10px;}
  .cond .meta{flex:1; min-width:0;}
  .cond .name{font-weight:600;}
  .cond .cfg{color:var(--muted); font-size:12.5px; margin-top:3px; word-break:break-all;}
  .cond .ops{display:flex; gap:6px; align-items:center;}
  .icon-btn{background:#fff; border:1px solid var(--line); border-radius:8px; width:34px;height:34px;display:flex;align-items:center;justify-content:center; color:var(--muted);}
  .icon-btn:hover{color:var(--primary); border-color:var(--primary);}
  .rule-box{margin-top:9px; padding:10px 11px; background:#fafbff; border:1px dashed #dde3ef; border-radius:9px;}
  .rule-box .cfg-ctrl{margin-top:0;}
  .not-toggle{font-size:12px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:#fff; color:var(--muted);}
  .not-toggle.on{background:var(--red); color:#fff; border-color:var(--red);}
  .or-divider{text-align:center; color:var(--orange); font-weight:700; margin:6px 0; font-size:13px; letter-spacing:2px;}
  .preview{padding:18px 20px;}
  .preview .count{font-size:22px; font-weight:700; color:var(--primary);}
  .scroll{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:12px;}
  /* modal */
  .modal-mask{position:fixed; inset:0; background:rgba(20,26,40,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:18px;}
  .modal-mask.open{display:flex;}
  .modal{background:#fff; border-radius:16px; width:min(960px,100%); max-height:88vh; display:flex; flex-direction:column; overflow:hidden;}
  .modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px;}
  .modal-body{display:grid; grid-template-columns:200px 1fr 320px; gap:0; flex:1; min-height:0;}
  .col{border-right:1px solid var(--line); overflow:auto; padding:14px;}
  .col:last-child{border-right:none; background:#fafbff;}
  .col h4{margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .l1-item{padding:10px 12px; border-radius:9px; cursor:pointer; font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .l1-item:hover{background:var(--primary-soft);}
  .l1-item.active{background:var(--primary); color:#fff;}
  .l2-group{margin-bottom:10px;}
  .l2-title{font-weight:700; font-size:13px; color:#46506a; margin:8px 0 5px;}
  .leaf{padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; border:1px solid transparent; display:flex; align-items:center; gap:7px;}
  .leaf:hover{border-color:var(--primary); background:#fff;}
  .leaf.picked{background:var(--primary-soft); color:var(--primary); border-color:var(--primary);}
  .leaf .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .leaf.picked .dot{background:var(--primary);}
  .sel-item{border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:10px; background:#fff;}
  .sel-item .top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .sel-item .nm{font-weight:600; font-size:13.5px;}
  .cfg-ctrl{margin-top:8px; display:flex; flex-wrap:wrap; gap:7px; align-items:center;}
  .cfg-ctrl input[type=number]{width:84px; border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:14px;}
  .chk{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; border:1px solid var(--line); border-radius:7px; padding:4px 8px; background:#fff; cursor:pointer;}
  .chk.on{background:var(--primary-soft); border-color:var(--primary); color:var(--primary);}
  .chk input{display:none;}
  .radio-pill{font-size:12.5px; border:1px solid var(--line); border-radius:7px; padding:5px 11px; background:#fff; cursor:pointer;}
  .radio-pill.on{background:var(--primary); color:#fff; border-color:var(--primary);}
  .modal-foot{padding:13px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end;}
  .empty{padding:40px; text-align:center; color:var(--muted);}
  /* smart agent */
  .chat-card{padding:0; overflow:hidden; display:flex; flex-direction:column; height:calc(100vh - 190px); min-height:440px;}
  .chat-head{padding:14px 20px; border-bottom:1px solid var(--line); font-weight:700; display:flex; align-items:center; gap:9px;}
  .chat-body{flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:82%; padding:12px 15px; border-radius:14px; font-size:14px; line-height:1.6;}
  .msg.user{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.bot.thinking{background:#fbfcff;}
  .step{display:flex; gap:10px; align-items:flex-start; margin-bottom:8px;}
  .step .dot{width:20px;height:20px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .step .txt{font-size:13.5px;}
  .step .txt b{color:var(--primary-deep);}
  .chip{display:inline-block; background:var(--primary-soft); color:var(--primary); border-radius:6px; padding:2px 9px; font-size:12px; margin:2px 4px 2px 0;}
  .result-card{margin-top:6px; border:1px solid var(--line); border-radius:12px; padding:14px; background:#fff;}
  .result-card .rc-title{font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .chat-input{border-top:1px solid var(--line); padding:13px 16px; display:flex; gap:10px; align-items:flex-end; background:#fff;}
  .chat-input textarea{flex:1; border:1px solid var(--line); border-radius:11px; padding:11px 13px; resize:none; min-height:46px; max-height:120px;}
  .suggestions{display:flex; gap:8px; flex-wrap:wrap; padding:0 20px 14px;}
  .suggestions .sg{font-size:12.5px; border:1px solid var(--line); border-radius:18px; padding:6px 13px; background:#fff; color:var(--muted);}
  .suggestions .sg:hover{border-color:var(--primary); color:var(--primary);}
  .back-link{color:var(--muted); font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-bottom:14px;}
  .back-link:hover{color:var(--primary);}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#1f2533; color:#fff; padding:11px 20px; border-radius:10px; font-size:14px; z-index:80; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
  @media (max-width:860px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .modal-body{grid-template-columns:1fr; max-height:80vh;}
    .col{border-right:none; border-bottom:1px solid var(--line); max-height:38vh;}
    .content{padding:14px;}
    th,td{padding:10px 10px; font-size:12.5px;}
    .nav{padding:0 12px; overflow-x:auto;}
  }
</style>

<script>
/* ============================================================
   选品中心 — 单文件应用
   数据层：指标树 / 500 商品 / 10 选品集（localStorage 持久化）
   渲染层：center / create / detail / smart，统一由 refreshAll() 调度
   ============================================================ */

/* ---------- 基础常量 ---------- */
const COUNTRIES = ['美国','英国','德国','法国','日本','加拿大','澳大利亚','意大利','西班牙','墨西哥','巴西','新加坡'];
const CATS = [
  {name:'3C数码', subs:['手机配件','电脑外设','智能穿戴','影音设备']},
  {name:'服饰鞋包', subs:['女装','男装','鞋靴','箱包']},
  {name:'家居家纺', subs:['床上用品','厨房用品','收纳整理','装饰摆件']},
  {name:'美妆个护', subs:['口红','护肤','香水','美发']},
  {name:'户外运动', subs:['帐篷','登山装备','骑行','健身器材']},
  {name:'母婴玩具', subs:['积木','毛绒玩具','婴童用品','益智玩具']},
  {name:'汽车配件', subs:['车载电子','车饰','维修工具','美容养护']},
  {name:'宠物用品', subs:['猫粮','狗粮','宠物玩具','清洁用品']},
];
function catSubs(name){ const c=CATS.find(x=>x.name===name); return c?c.subs:[]; }

/* 指标树（三级）。叶子 => 可被选中的筛选指标，带 type 决定配置 UI */
const INDICATOR_TREE = [
  {name:'商品基础属性', children:[
    {key:'cat', name:'商品类目', type:'category'},
    {key:'price_band', name:'价格带', type:'range', unit:'¥', min:0, max:1000},
    {key:'weight', name:'商品重量', type:'range', unit:'kg', min:0, max:50},
    {key:'size', name:'商品尺寸', type:'range', unit:'cm', min:0, max:200},
    {key:'brand_type', name:'品牌类型', type:'enum', options:['品牌','白牌','OEM']},
  ]},
  {name:'物流与履约', children:[
    {key:'ship_country', name:'可运达国家', type:'country'},
    {key:'ship_time', name:'发货时效', type:'enum', options:['24小时内','48小时内','72小时内','7天内']},

const IND_MAP = {};
(function buildMap(){
  for(const l1 of INDICATOR_TREE){
    for(const l2 of l1.children){
      if(l2.children){ for(const l3 of l2.children){ IND_MAP[l3.key]=Object.assign({l1:l1.name,l2:l2.name},l3); } }
      else { IND_MAP[l2.key]=Object.assign({l1:l1.name},l2); }
    }
  }
})();

/* ---------- 商品生成（确定性随机，500 条） ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20260905);
const rand=(a,b)=>a+rng()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(rng()*arr.length)];
function pickN(arr,n){const c=arr.slice();const o=[];n=Math.min(n,c.length);for(let i=0;i<n;i++){o.push(c.splice(Math.floor(rng()*c.length),1)[0]);}return o;}

const SKU_COUNT = 500;                                        // 演示商品库规模（改这里即可，全库联动）
function genProducts(){
  const list=[];
  for(let i=1;i<=SKU_COUNT;i++){

    list.push({
      id:'P'+String(i).padStart(4,'0'),

      weight:Math.round(rand(0.05,28)*100)/100,
      size:ri(3,160),
      brand_type:pick(['品牌','白牌','OEM']),
      ship_country:pickN(COUNTRIES,ri(2,8)),
      ship_time:pick(['24小时内','48小时内','72小时内','7天内']),
      logistics:pick(['空运','海运','国际快递','专线']),
      overseas_wh:rng()<0.4,
      daily_sales:daily,
      monthly_sales:daily*ri(15,30)+ri(0,400),
      cvr:Math.round(rand(1,28)*10)/10,
      return_rate:Math.round(rand(1,24)*10)/10,
      competition:pick(['高','中','低']),
      cat_rank:ri(1,7900),
      new_ratio:ri(0,82),
      rating:Math.round(rand(3.0,5.0)*10)/10,
      review_count:ri(0,42000),
      neg_rate:Math.round(rand(0,14)*10)/10,
      gross_margin:Math.round(rand(5,76)*10)/10,
      aov:Math.round(rand(8,640)*100)/100,
      acos:Math.round(rand(5,62)*10)/10,
      search_heat:ri(0,100),
      growth:pick(['上升','平稳','下降']),
      social:ri(0,78000),
      season:pick(['旺季','平季','淡季']),
      ip_risk:rng()<0.18,
      cert:rng()<0.5?pickN(['CE','FCC','RoHS','CPC','无要求'],ri(1,3)):['无要求'],
      prohibited:rng()<0.08,
    });
  }
  // ↓↓↓ 第二遍独立遍历：追加给 Skill/MCP 使用的机器可读标签字段。
  //     必须与第一遍分离——否则会污染后续商品的随机序列，导致整份数据漂移。
  //     这些字段不进入运营侧指标库：标签体系（机器用）⊇ 指标库（运营手动筛选用）
  for(const p of list){
    p.stock_available=ri(0,5000);                            // 可售库存
    p.delivery_days=ri(2,20);                                // 预计送达天数
    // 履约成功率：右偏分布——多数卖家履约良好，少数拉胯（贴合真实平台分布）
    p.fulfillment_rate=Math.round((rng()<0.6?rand(0.97,1.0):rand(0.88,0.99))*1000)/1000;
    p.sellable_days=ri(0,200);                               // 可售天数
    p.listing_age=ri(1,720);                                 // 上架天数
    p.add_to_cart=Math.round(rand(0.5,15)*10)/10;            // 加购率 %
    p.promo_depth=Math.round(rand(0,60)*10)/10;              // 折扣力度 %
    p.stock_age=ri(1,400);                                   // 库龄（天）
    p.sell_through=Math.round(rand(5,95)*10)/10;             // 动销率 %
    p.new_item_support=rng()<0.3;                            // 是否参与新品扶持
  }
  // ↓↓↓ 第三遍独立遍历：主题 / 风格 / 本地发货 / 美元售价。
  //     服务于「节日主题会场」「本地小商品速递」等场景，同样必须独立成遍。
  // 节日主题：按类目亲和度加权，而非全库均匀随机。
  // 否则「万圣节装饰会场」会圈进维修工具、登山装备等不相关类目，mock 数据失去说服力。
  const THEME_HI = ['家居家纺|装饰摆件','家居家纺|厨房用品','家居家纺|收纳整理','母婴玩具|毛绒玩具','美妆个护|口红','服饰鞋包|女装','宠物用品|宠物玩具'];
  const THEME_MID= ['服饰鞋包|男装','美妆个护|香水','母婴玩具|益智玩具','家居家纺|床上用品','美妆个护|美发','母婴玩具|积木'];
  function weightedPick(pairs){                               // pairs: [[值,权重],...]，权重之和需为 1
    let r=rng(), acc=0;
    for(const [v,w] of pairs){ acc+=w; if(r<acc) return v; }
    return pairs[pairs.length-1][0];
  }
  function themeOf(p){
    const k=p.cat_l1+'|'+p.cat_l2;
    if(THEME_HI.indexOf(k)>=0)  return weightedPick([['halloween',0.50],['christmas',0.14],['easter',0.05],['none',0.31]]);
    if(THEME_MID.indexOf(k)>=0) return weightedPick([['halloween',0.20],['christmas',0.20],['easter',0.08],['none',0.52]]);
    return weightedPick([['halloween',0.05],['christmas',0.05],['easter',0.03],['none',0.87]]);
  }
  // 风格调性：与节日主题联动（哥特 ↔ 万圣节、萌系/复古 ↔ 圣诞）
  function styleOf(theme){
    if(theme==='halloween') return weightedPick([['gothic',0.46],['cute',0.14],['retro',0.14],['minimal',0.10],['none',0.16]]);
    if(theme==='christmas') return weightedPick([['cute',0.30],['retro',0.28],['minimal',0.20],['gothic',0.06],['none',0.16]]);
    if(theme==='easter')    return weightedPick([['cute',0.44],['minimal',0.22],['retro',0.14],['gothic',0.03],['none',0.17]]);
    return weightedPick([['minimal',0.30],['retro',0.22],['cute',0.16],['gothic',0.06],['none',0.26]]);
  }
  for(const p of list){
    p.theme=themeOf(p);                                      // 节日主题属性（万圣节/圣诞/复活节/无）
    p.style=styleOf(p.theme);                                // 风格调性（哥特/极简/复古/萌系/无）
    // 本地仓可发国家：约 60% 的商品在部分可运达国有本地仓
    p.local_wh = rng()<0.6 ? pickN(p.ship_country, ri(1,3)) : [];
    // 美元售价：与人民币价格带按 7.2 汇率折算，保留两位
    p.price_usd=Math.round((p.price_band/7.2)*100)/100;
  }
  return list;
}
const PRODUCTS = genProducts();

/* ---------- 筛选引擎 ---------- */
function isConfigured(cond){
  const ind=IND_MAP[cond.key]; const v=cond.value; if(!ind||!v) return false;
  if(ind.type==='range') return v.min!=null||v.max!=null;
  if(ind.type==='enum'||ind.type==='country') return (v.values&&v.values.length)>0;
  if(ind.type==='category') return ((v.l2&&v.l2.length)>0);
  if(ind.type==='bool') return v.value!==undefined && v.value!==null;
  return false;
}
function evalCondition(p, cond){
  const ind = IND_MAP[cond.key]; if(!ind) return false;
  if(!isConfigured(cond)) return true; // 未配置取值的条件不生效，避免误杀结果
  const pv = p[cond.key];
  let res=false;
  if(ind.type==='range'){
    const mn=cond.value.min, mx=cond.value.max;
    res=(mn==null||pv>=mn)&&(mx==null||pv<=mx);
  } else if(ind.type==='enum'){
    if(ind.key==='cert'){ res=Array.isArray(pv)?pv.some(v=>cond.value.values.includes(v)):cond.value.values.includes(pv); }
    else { res=cond.value.values.includes(pv); }
  } else if(ind.type==='country'){
    // 可运达国家：商品可运达所选国家中的“任一”即可（覆盖目标市场之一）
    res=cond.value.values.some(c=>pv.includes(c));
  } else if(ind.type==='category'){
    const v=cond.value;
    res = (v.l2&&v.l2.length)? v.l2.includes(p.cat_l2) : true;
  } else if(ind.type==='bool'){
    res=(pv===cond.value.value);
  }
  return cond.not? !res : res;
}
function matchesGroups(p, groups){
  if(!groups || groups.length===0) return false;
  return groups.some(g=> g.length>0 && g.every(c=>evalCondition(p,c)));
}
function filterProducts(groups){ return PRODUCTS.filter(p=>matchesGroups(p,groups)); }

function mcText(map,k){ return (map&&map[k])||k||'—'; }
function mcValue(v){
  if(v===null||v===undefined) return '—';
  if(typeof v==='boolean') return v?'是':'否';
  if(Array.isArray(v)) return v.join(' / ');
  if(typeof v==='object') return [].concat(v.cat_l1||[], v.cat_l2||[]).join(' / ') || '—';
  return String(v);
}
function mcpPoolToSet(p){
  const rules=p.rules_with_source||[], funnel=p.funnel||[], conflicts=p.conflicts||[];
  return {
    id:p.pool_id, name:p.name||p.pool_id,
    creator:p.created_by||'规则引擎复跑',
    desc:[mcText(MC.activity,p.activity), mcText(MC.market,p.market), mcText(MC.poolType,p.product_pool_type)].join(' · '),

    source:'mcp',

      activity:p.activity, market:p.market, poolType:p.product_pool_type,
      target:p.target_sku_count, publish:p.publish_status },

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function fmtCondValue(cond){
  const ind=IND_MAP[cond.key]; if(!ind) return '';
  const v=cond.value; let s='';
  if(ind.type==='range'){
    const mn=v.min==null?'':v.min, mx=v.max==null?'':v.max;
    s = (mn&&mx)? `${mn}~${mx}${ind.unit}` : mn? `≥${mn}${ind.unit}` : mx? `≤${mx}${ind.unit}` : '（未配置）';
  } else if(ind.type==='enum'){
    s = v.values.length? v.values.join('/') : '（未选）';
  } else if(ind.type==='country'){
    s = v.values.length? ('可运达：'+v.values.join('/')) : '（未选）';
  } else if(ind.type==='category'){
    s = (v.l2&&v.l2.length)? ('类目明细：'+v.l2.join('/')) : '（未选）';
  } else if(ind.type==='bool'){
    s = v.value? '有' : '无';
  }
  return s;
}

function condHtml(cond,gi,ci){
  const ind=IND_MAP[cond.key]; if(!ind) return ''; // 兼容旧数据中的已下线指标
  const configured=isConfigured(cond);
  return `<div class="cond">
    <div class="meta">
      <div class="name">${esc(ind.name)} <span class="tag gray">${esc(ind.l1)}</span> ${cond.not?'<span class="tag" style="background:#fde8e8;color:var(--red)">非 NOT</span>':''}</div>
      <div class="cfg">${configured? esc(fmtCondValue(cond)) : '<span style="color:var(--orange)">⚠ 未配置规则，该条件暂不生效</span>'}</div>
      <div class="rule-box">${condConfigHtml(cond,gi,ci)}</div>
    </div>
    <div class="ops">
      <button class="not-toggle ${cond.not?'on':''}" onclick="toggleNot(${gi},${ci})">非</button>
      <button class="icon-btn" title="删除" onclick="removeCond(${gi},${ci})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      </button>
    </div>
  </div>`;
}
function condConfigHtml(cond,gi,ci){
  const ind=IND_MAP[cond.key]; const v=cond.value;
  if(ind.type==='range'){
    return `<div class="cfg-ctrl" style="margin-top:8px">
      最小值<input type="number" value="${v.min==null?'':v.min}" oninput="condSetRange(${gi},${ci},'min',this.value)" placeholder="最小">
      最大值<input type="number" value="${v.max==null?'':v.max}" oninput="condSetRange(${gi},${ci},'max',this.value)" placeholder="最大"> ${esc(ind.unit||'')}
      <span class="muted" style="font-size:12px">（留空表示不限）</span></div>`;
  }
  if(ind.type==='enum'){
    return `<div class="cfg-ctrl" style="margin-top:8px">${ind.options.map(o=>`<label class="chk ${v.values.includes(o)?'on':''}" onclick="condToggleArr(${gi},${ci},'values','${esc(o)}')"><input type="checkbox" ${v.values.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
  }
  if(ind.type==='country'){
    return `<div class="cfg-ctrl" style="margin-top:8px;max-height:130px;overflow:auto">${COUNTRIES.map(o=>`<label class="chk ${v.values.includes(o)?'on':''}" onclick="condToggleArr(${gi},${ci},'values','${esc(o)}')"><input type="checkbox" ${v.values.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div><div class="muted" style="font-size:11.5px;margin-top:3px">商品可运达所选国家中的“任一”即可（覆盖目标市场之一）</div>`;
  }
  if(ind.type==='bool'){
    const val=v.value;
    return `<div class="cfg-ctrl" style="margin-top:8px"><span class="radio-pill ${val===true?'on':''}" onclick="condSetBool(${gi},${ci},true)">有</span><span class="radio-pill ${val===false?'on':''}" onclick="condSetBool(${gi},${ci},false)">无</span></div>`;
  }
  if(ind.type==='category'){
    let h='<div style="margin-top:8px">';
    for(const cat of CATS){
      const subs=cat.subs;
      const allOn=subs.every(s=>(v.l2||[]).includes(s));
      h+=`<div style="margin:7px 0"><label class="chk ${allOn?'on':''}" onclick="condToggleCatL1(${gi},${ci},'${esc(cat.name)}')"><input type="checkbox" ${allOn?'checked':''}>全选「${esc(cat.name)}」</label><div style="display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 2px 18px">`;
      for(const sub of subs){
        const on=(v.l2||[]).includes(sub);
        h+=`<label class="chk ${on?'on':''}" onclick="condToggleCatL2(${gi},${ci},'${esc(sub)}')"><input type="checkbox" ${on?'checked':''}>${esc(sub)}</label>`;
      }
      h+='</div></div>';
    }
    h+='</div>';
    return h;
  }
  return '';
}
function draftVal(k,v){ state.draft[k]=v; }
function addGroup(){ state.draft.groups.push([]); refreshAll(); }
function removeCond(gi,ci){ state.draft.groups[gi].splice(ci,1); refreshAll(); }
function toggleNot(gi,ci){ state.draft.groups[gi][ci].not=!state.draft.groups[gi][ci].not; refreshAll(); }
/* 指标规则配置（作用于选品集里的条件，而非指标库弹窗） */
function condSetRange(gi,ci,edge,val){ const c=state.draft.groups[gi][ci]; c.value[edge]= (val==='')?null:Number(val); } // 不重渲染，保留输入焦点
function condToggleArr(gi,ci,field,opt){ const arr=state.draft.groups[gi][ci].value[field]; const i=arr.indexOf(opt); if(i>=0) arr.splice(i,1); else arr.push(opt); refreshAll(); }
function condSetBool(gi,ci,val){ state.draft.groups[gi][ci].value.value=val; refreshAll(); }
function condToggleCatL2(gi,ci,sub){ const v=state.draft.groups[gi][ci].value; (v.l2=v.l2||[]); const i=v.l2.indexOf(sub); if(i>=0) v.l2.splice(i,1); else v.l2.push(sub); refreshAll(); }
function condToggleCatL1(gi,ci,catName){ const v=state.draft.groups[gi][ci].value; (v.l2=v.l2||[]); const subs=catSubs(catName); const allOn=subs.every(s=>v.l2.includes(s)); if(allOn){ subs.forEach(s=>{const i=v.l2.indexOf(s); if(i>=0) v.l2.splice(i,1);}); } else { subs.forEach(s=>{ if(!v.l2.includes(s)) v.l2.push(s); }); } refreshAll(); }

function saveSet(){

/* MCP 商品池：规则与来源（纯 HTML 构造，不写 DOM、不触发其他渲染） */
function buildMcpRules(rules){
  if(!rules.length) return '<div class="muted" style="font-size:13px">无规则记录</div>';
  return rules.map((r,i)=>`
    <div class="rule-row">
      <span class="muted" style="width:22px">${i+1}</span>
      <span class="rule-nm">${esc(r.name_cn||r.tag_id)}</span>
      <span class="rule-op">${esc(mcText(MC.op,r.operator))} <b>${esc(mcValue(r.value))}</b></span>
      ${r.never_relax?'<span class="lock">不可放宽</span>':''}
      <span style="flex:1"></span>
      <span class="src-tag">来源：${esc(r.source_id||'—')}</span>
    </div>`).join('');
}
/* MCP 商品池：逐条件漏斗（只呈现事实，不做结论） */
function buildMcpFunnel(funnel){
  if(!funnel.length) return '';
  const max=funnel[0]&&funnel[0].remaining?funnel[0].remaining:1;
  return `
    <div class="card" style="margin-bottom:18px">
      <div class="section-title">逐条件漏斗</div>
      <div class="scroll" style="max-height:340px;margin:0 20px 20px">
        <table>
          <thead><tr><th>步骤</th><th>条件</th><th style="width:120px">剩余（占比）</th><th>本步过滤</th><th>本步过滤占比</th></tr></thead>
          <tbody>
            ${funnel.map(f=>{
              const w=Math.round((f.remaining/max)*100);
              return `<tr>
                <td>${f.step}</td>
                <td>${esc(f.condition)}</td>
                <td><div style="display:flex;align-items:center;gap:8px"><span class="fbar"><i class="${f.ratio>=50?'warn':''}" style="width:${w}%"></i></span><b>${f.remaining}</b></div></td>
                <td>${f.filtered}</td>
                <td style="color:${f.ratio>=50?'var(--orange)':'inherit'}">${f.ratio}%</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
/* MCP 商品池：冲突提示（事实 + 参考动作，是否放宽由人决定） */
function buildMcpConflict(conflicts){
  if(!conflicts.length) return '';
  return `
    <div class="card" style="margin-bottom:18px">
      <div class="section-title">冲突提示</div>
      <div style="padding:0 20px 18px">
        ${conflicts.map(c=>`
          <div class="cf-item">
            <div class="t">${esc(c.conflict_id||'')} ${esc(c.conflict||'')} ${c.relaxable?'<span class="tag gray" style="margin-left:6px">可放宽</span>':'<span class="lock" style="margin-left:6px">不可放宽</span>'}</div>
            <div class="f">${esc(c.fact||'')}</div>
            <div class="a">参考动作：${esc(c.reference_action||'—')}</div>
          </div>`).join('')}
        <div class="note">以上为系统呈现的事实与参考动作，不做自动放宽、不代替判断；是否调整规则需人工确认后由 Skill 重新执行。</div>
      </div>
    </div>`;
}

function openModal(gi){ state.modal={l1:null, activeGroup:gi, selected:{}}; renderModal(); document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); state.modal=null; }
function renderModal(){
  const m=state.modal;
  // 一级
  document.getElementById('modalL1').innerHTML='<h4>一级指标</h4>'+INDICATOR_TREE.map(l1=>
    `<div class="l1-item ${m.l1===l1.name?'active':''}" onclick="selectL1('${esc(l1.name)}')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>${esc(l1.name)}</div>`).join('');
  // 中间：该一级下的指标（叶子），点击即选中
  let mid='<h4>可选指标</h4>';
  if(!m.l1){ mid+='<div class="muted" style="font-size:13px">← 请选择左侧一级指标</div>'; }
  else{
    const l1=INDICATOR_TREE.find(x=>x.name===m.l1);
    for(const l2 of l1.children){
      const picked=!!m.selected[l2.key];
      mid+=`<div class="leaf ${picked?'picked':''}" onclick="selectLeaf('${l2.key}')"><span class="dot"></span>${esc(l2.name)}<span class="muted" style="margin-left:auto;font-size:11px">${typeLabel(l2.type)}</span></div>`;
    }
  }
  document.getElementById('modalMid').innerHTML=mid;
  // 右侧：仅展示已选指标（取值在选品集的「指标规则」中配置）
  const keys=Object.keys(m.selected);
  let right = keys.length? '' : '<div class="muted" style="font-size:13px">在中间栏点击指标即可加入此处。取值规则请在选品集的「指标规则」中配置。</div>';
  for(const k of keys){
    const ind=IND_MAP[k];
    right+=`<div class="sel-item"><div class="top"><span class="nm">${esc(ind.name)}</span><button class="icon-btn" onclick="removeSelected('${k}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="muted" style="font-size:11.5px">${typeLabel(ind.type)} · 待配置规则</div></div>`;
  }
  document.getElementById('modalSel').innerHTML=right;
}
function typeLabel(t){ return ({range:'数值区间',enum:'多选',country:'国家多选',bool:'有无',category:'类目树'})[t]||''; }
function selectL1(name){ state.modal.l1=name; renderModal(); }
function selectLeaf(key){
  const m=state.modal;
  if(!m.selected[key]){
    const ind=IND_MAP[key];
    let val;
    if(ind.type==='range') val={min:null,max:null};
    else if(ind.type==='enum'||ind.type==='country') val={values:[]};
    else if(ind.type==='category') val={l2:[]};
    else if(ind.type==='bool') val={value:undefined};
    m.selected[key]={value:val};
  }
  renderModal();
}
function removeSelected(key){ delete state.modal.selected[key]; renderModal(); }
function confirmModal(){
  const m=state.modal; const gi=m.activeGroup;
  let added=0;
  for(const key of Object.keys(m.selected)){
    const val=JSON.parse(JSON.stringify(m.selected[key].value));
    // 若已存在同指标条件则跳过（避免重复）
    if(state.draft.groups[gi].some(c=>c.key===key)) continue;
    state.draft.groups[gi].push({key, value:val, not:false});
    added++;
  }
  closeModal();
  if(added===0) toast('已选指标均已加入（无新增）');
  else { state.previewLoaded=false; refreshAll(); }
}

/* ============================================================
   智能选品 Agent
   ============================================================ */
const CN_COUNTRY={'美国':'美国','美区':'美国','英国':'英国','德国':'德国','法国':'法国','日本':'日本','加拿大':'加拿大','澳洲':'澳大利亚','澳大利亚':'澳大利亚','意大利':'意大利','西班牙':'西班牙','墨西哥':'墨西哥','巴西':'巴西','新加坡':'新加坡'};
const CN_CAT={'3C':'3C数码','数码':'3C数码','电子':'3C数码','服饰':'服饰鞋包','服装':'服饰鞋包','鞋':'服饰鞋包','美妆':'美妆个护','护肤':'美妆个护','家居':'家居家纺','家纺':'家居家纺','户外':'户外运动','运动':'户外运动','母婴':'母婴玩具','玩具':'母婴玩具','汽车':'汽车配件','车载':'汽车配件','宠物':'宠物用品'};
function parseSmart(text){
  const groups=[]; const conds=[]; const steps=[];
  const t=text;
  // 价格
  let pm=t.match(/(\d+(?:\.\d+)?)\s*(?:元|¥|\$|美金)?/g);
  const priceIdx=t.search(/价格|售价|客单价|单价|价位/);
  if(priceIdx>=0){
    const seg=t.slice(priceIdx);
    const nums=(seg.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
    if(nums.length){
      const lower=/低于|小于|不超过|以下|至多/.test(seg);
      const higher=/高于|大于|超过|以上|至少/.test(seg);
      const range=/到|至|-|~/.test(seg);
      let val;
      if(range && nums.length>=2) val={min:nums[0],max:nums[1]};
      else if(lower) val={max:nums[0]};
      else if(higher) val={min:nums[0]};
      else val={min:nums[0],max:nums[0]};
      conds.push(c('price_band',val));
      steps.push(`识别到「价格」诉求，映射为指标库【价格带】，取值 ${fmtCondValue({key:'price_band',value:val})}。`);
    }
  }
  // 国家
  let countries=[];
  for(const k in CN_COUNTRY){ if(t.includes(k)) countries.push(CN_COUNTRY[k]); }
  if(/欧美/.test(t)) countries=countries.concat(['美国','英国','德国','法国']);
  if(/北美/.test(t)) countries=countries.concat(['美国','加拿大','墨西哥']);
  countries=[...new Set(countries)];
  if(countries.length){ conds.push(c('ship_country',{values:countries})); steps.push(`识别到目标市场【${countries.join('、')}】，映射为指标库【可运达国家】。`); }
  // 类目
  let cats=[];
  for(const k in CN_CAT){ if(t.includes(k)) cats.push(CN_CAT[k]); }
  cats=[...new Set(cats)];
  if(cats.length){ conds.push(c('cat',{l2:cats.flatMap(n=>catSubs(n))})); steps.push(`识别到品类【${cats.join('、')}】，映射为指标库【商品类目】，已展开其下明细类目。`); }
  // 销量
  if(/月销/.test(t)){ const n=(t.match(/月销[^\d]*(\d+)/)||[])[1]; if(n) conds.push(c('monthly_sales',{min:Number(n)})); }
  else if(/日销|销量|动销/.test(t)){ const n=(t.match(/(?:日销|销量|动销)[^\d]*(\d+)/)||[])[1]; if(n) conds.push(c('daily_sales',{min:Number(n)})); }
  // 评分
  if(/评分|星/.test(t)){ const n=(t.match(/(?:评分|星)[^\d]*(\d(?:\.\d)?)/)||[])[1]; if(n) conds.push(c('rating',{min:Number(n)})); }
  // 退货
  if(/退货/.test(t)){ const n=(t.match(/退货[^\d]*(\d+)/)||[])[1]; if(n) conds.push(c('return_rate',{max:Number(n)})); }
  // 毛利
  if(/毛利/.test(t)){ const n=(t.match(/毛利[^\d]*(\d+)/)||[])[1]; if(n) conds.push(c('gross_margin',{min:Number(n)})); }
  // 海外仓
  if(/海外仓/.test(t)){ conds.push(c('overseas_wh',{value:true})); steps.push('识别到「海外仓」诉求，映射为指标库【海外仓=有】。'); }
  // 品牌/白牌
  if(/白牌/.test(t)) conds.push(c('brand_type',{values:['白牌']}));
  else if(/品牌/.test(t)) conds.push(c('brand_type',{values:['品牌']}));
  // 增长/趋势
  if(/上升|增长|爆款|潜力/.test(t)) conds.push(c('growth',{values:['上升']}));
  else if(/下降|衰退/.test(t)) conds.push(c('growth',{values:['下降']}));
  // 搜索热度
  if(/热度|搜索/.test(t)){ const n=(t.match(/(?:热度|搜索)[^\d]*(\d+)/)||[])[1]; if(n) conds.push(c('search_heat',{min:Number(n)})); }
  // 非/排除
  if(/不要|排除|不含|无侵权|无知识|没有/.test(t)){
    if(!conds.some(cd=>cd.key==='ip_risk')) conds.push(c('ip_risk',{value:false}));
  }

  if(conds.length===0){ conds.push(c('daily_sales',{min:50}),c('competition',{values:['低']})); steps.push('未识别到明确指标，已使用默认「稳定日销 + 低竞争」热销条件。'); }

  groups.push(conds);
  return {groups, steps, countries, cats};
}

function renderSmart(){
  const html=`
    <div class="card chat-card">
      <div class="chat-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f54eb" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        智能选品 Agent
        <span class="pill" style="margin-left:8px">输入需求，自动理解并生成选品集</span>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="msg bot">你好，我是选品助手。请用一句话描述你想要的选品，例如：<br>“帮我找面向欧美市场、价格 100 到 400 元的 3C 数码，且要有海外仓”。</div>
      </div>
      <div class="suggestions">
        <span class="sg" onclick="fillSg(this)">帮我找面向欧美市场、价格100到400元的3C数码，且要有海外仓</span>
        <span class="sg" onclick="fillSg(this)">日本可运达的轻小件商品，重量2kg以内、价格100元以下</span>
        <span class="sg" onclick="fillSg(this)">美妆个护类目，毛利率40%以上、竞争强度为低的高毛利款</span>
        <span class="sg" onclick="fillSg(this)">白牌服饰，退货率低于15%，排除知识产权风险</span>
      </div>
      <div class="chat-input">
        <textarea id="smartInput" placeholder="描述选品需求…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();smartSend();}"></textarea>
        <button class="btn" onclick="smartSend()">发送</button>
      </div>
    </div>`;
  document.getElementById('content').innerHTML=html;
}
function fillSg(el){ document.getElementById('smartInput').value=el.textContent; }
function smartSend(){
  const input=document.getElementById('smartInput');
  const text=input.value.trim(); if(!text) return;
  const body=document.getElementById('chatBody');
  body.innerHTML+=`<div class="msg user">${esc(text)}</div>`;
  input.value='';
  const {groups,steps}=parseSmart(text);
  state.lastSmart={text, groups};
  // 思考流程（逐步出现）
  const think=document.createElement('div');
  think.className='msg bot thinking';
  think.innerHTML='<b>🤔 正在分析需求…</b>';
  body.appendChild(think);
  body.scrollTop=body.scrollHeight;

  const stepEls=[];
  const intro=document.createElement('div');
  intro.className='msg bot';
  intro.innerHTML='<b>选品思考流程</b>';
  body.appendChild(intro); stepEls.push(intro);

  let i=0;
  function nextStep(){
    if(i<steps.length){
      const s=document.createElement('div');
      s.className='msg bot thinking';
      s.innerHTML=`<div class="step"><span class="dot">${i+1}</span><div class="txt">${esc(steps[i])}</div></div>`;
      body.appendChild(s); body.scrollTop=body.scrollHeight; stepEls.push(s); i++;
      setTimeout(nextStep,420);
    } else {
      // 汇总 + 生成
      const matched=filterProducts(groups);
      const condSummary=groups[0].map(cd=>{const ind=IND_MAP[cd.key];return `<span class="chip">${esc(ind.name)}: ${esc(fmtCondValue(cd))}</span>`;}).join('');
      const res=document.createElement('div');
      res.className='msg bot';
      res.innerHTML=`<div class="result-card">
        <div class="rc-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> 已生成选品集</div>
        <div>命中商品 <b style="color:var(--primary);font-size:18px">${matched.length}</b> 个</div>
        <div style="margin:8px 0">${condSummary}</div>
        <button class="btn sm" onclick="commitSmart()">保存为选品集并查看</button>
      </div>`;
      body.appendChild(res); body.scrollTop=body.scrollHeight;
      think.remove();
    }
  }
  setTimeout(nextStep,500);
}
function commitSmart(){
  const ls=state.lastSmart; if(!ls) return;
  const text=ls.text, groups=ls.groups;
  const matched=filterProducts(groups);
  const now=new Date(); const ymd=now.toISOString().slice(0,10);
  const id='PS'+now.getTime().toString().slice(-6);
  const name=text.length>16? text.slice(0,16)+'…' : text;
  const set={ id, name:'AI·'+name, creator:'智能选品Agent', desc:'由智能选品 Agent 自动生成：'+text,
    createTime:ymd, effStart:'', effEnd:'', groups:JSON.parse(JSON.stringify(groups)),
    productIds:matched.map(p=>p.id), productCount:matched.length };
  state.sets.unshift(set); saveSets();
  state.view='detail'; state.detailId=id; refreshAll();
  toast('智能选品集已生成：'+id);
}

}
